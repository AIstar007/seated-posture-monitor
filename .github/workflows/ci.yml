name: tests

on:
  push:
  pull_request:

jobs:
  unit-and-package-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install package entry point
        run: python -m pip install -e . --no-deps
      - name: Compile source and tests
        run: python -m compileall -q posture_monitor.py src tests scripts
      - name: Run tests
        run: python -m pytest -q
      - name: Verify installed CLI
        run: seated-posture-monitor --help

  mediapipe-cpu-inference-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies and package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Execute one real CPU inference with the pinned model
        run: python scripts/smoke_test_mediapipe.py
