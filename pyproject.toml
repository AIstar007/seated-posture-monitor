[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seated-posture-monitor"
dynamic = ["version"]
description = "CPU-only seated posture monitoring CLI"
requires-python = ">=3.10"
dependencies = [
  "mediapipe==1.2.2",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
seated-posture-monitor = "seated_posture_monitor.cli:main"

[tool.setuptools.dynamic]
version = {attr = "seated_posture_monitor.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
